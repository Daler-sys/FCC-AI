<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PythonCamp — Полный курс Python</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/dracula.min.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a23;
  --bg-secondary: #1b1b32;
  --bg-tertiary: #2a2a40;
  --text: #dfdfe2;
  --text-muted: #858591;
  --accent: #f1be32;
  --accent-hover: #facc15;
  --success: #37d97a;
  --error: #ef4444;
  --border: #3b3b4f;
  --link: #99c9ff;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
.header {
  background: var(--bg-secondary);
  border-bottom: 2px solid var(--accent);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}
.logo svg { width: 40px; height: 40px; }
.logo-text {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.logo-text span { color: var(--accent); }
.header-actions { display: flex; gap: 12px; align-items: center; }
.progress-badge {
  background: var(--bg-tertiary);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  color: var(--text-muted);
}
.progress-badge strong { color: var(--accent); }
.btn-reset {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}
.btn-reset:hover { border-color: var(--error); color: var(--error); }
.menu-toggle {
  display: none;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 18px;
}
.landing {
  max-width: 1200px;
  margin: 0 auto;
  padding: 60px 24px;
  text-align: center;
}
.landing-hero { margin-bottom: 60px; }
.landing h1 {
  font-size: 48px;
  font-weight: 800;
  margin-bottom: 20px;
  background: linear-gradient(135deg, var(--accent), #facc15, #99c9ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.landing p.lead {
  font-size: 20px;
  color: var(--text-muted);
  max-width: 700px;
  margin: 0 auto 32px;
  line-height: 1.6;
}
.btn-primary {
  background: var(--accent);
  color: var(--bg);
  border: none;
  padding: 14px 32px;
  font-size: 16px;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); }
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 60px;
}
.stat-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
}
.stat-card .num {
  font-size: 36px;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 8px;
}
.stat-card .label { color: var(--text-muted); font-size: 14px; }
.sections-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  text-align: left;
}
.section-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.section-card:hover {
  border-color: var(--accent);
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(241, 190, 50, 0.1);
}
.section-card .section-num {
  font-size: 12px;
  color: var(--accent);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.section-card h3 {
  font-size: 18px;
  margin-bottom: 12px;
}
.section-card .desc {
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 16px;
}
.section-card .progress-bar {
  height: 6px;
  background: var(--bg-tertiary);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}
.section-card .progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--success));
  transition: width 0.3s;
}
.section-card .progress-text {
  font-size: 12px;
  color: var(--text-muted);
}
.course-view {
  display: none;
  height: calc(100vh - 65px);
}
.course-view.active { display: flex; }
.sidebar {
  width: 320px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
}
.sidebar-section { border-bottom: 1px solid var(--border); }
.sidebar-section-header {
  padding: 16px 20px;
  font-weight: 700;
  font-size: 14px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-tertiary);
}
.sidebar-section-header:hover { background: #33334d; }
.sidebar-section-header .arrow { transition: transform 0.2s; font-size: 12px; }
.sidebar-section.collapsed .arrow { transform: rotate(-90deg); }
.sidebar-section.collapsed .lesson-list { display: none; }
.lesson-list { padding: 8px 0; }
.lesson-item {
  padding: 10px 20px 10px 36px;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.15s;
  border-left: 3px solid transparent;
  color: var(--text-muted);
}
.lesson-item:hover {
  background: var(--bg-tertiary);
  color: var(--text);
}
.lesson-item.active {
  background: var(--bg-tertiary);
  color: var(--text);
  border-left-color: var(--accent);
}
.lesson-item.completed::before {
  content: '✓';
  color: var(--success);
  font-weight: bold;
  font-size: 14px;
}
.lesson-item:not(.completed)::before {
  content: '○';
  color: var(--text-muted);
  font-size: 14px;
}
.main-content {
  flex: 1;
  display: flex;
  overflow: hidden;
}
.theory-panel {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px;
  max-width: 600px;
  min-width: 380px;
  border-right: 1px solid var(--border);
}
.theory-panel h1 { font-size: 28px; margin-bottom: 8px; color: var(--text); }
.theory-panel .lesson-meta {
  color: var(--text-muted);
  font-size: 13px;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.theory-panel h2 { font-size: 20px; margin: 24px 0 12px; color: var(--accent); }
.theory-panel h3 { font-size: 16px; margin: 16px 0 8px; }
.theory-panel p { line-height: 1.7; margin-bottom: 12px; color: var(--text); }
.theory-panel ul, .theory-panel ol { margin: 12px 0 12px 24px; line-height: 1.7; }
.theory-panel li { margin-bottom: 6px; }
.theory-panel code {
  background: var(--bg-tertiary);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  color: var(--accent);
}
.theory-panel pre {
  background: var(--bg-tertiary);
  padding: 14px 16px;
  border-radius: 8px;
  margin: 12px 0;
  overflow-x: auto;
  border-left: 3px solid var(--accent);
}
.theory-panel pre code {
  background: none;
  padding: 0;
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
}
.theory-panel .info-box {
  background: rgba(241, 190, 50, 0.08);
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  margin: 16px 0;
  border-radius: 4px;
  font-size: 14px;
}
.theory-panel .challenge-box {
  background: rgba(55, 217, 122, 0.08);
  border: 1px solid rgba(55, 217, 122, 0.3);
  padding: 16px;
  margin: 20px 0;
  border-radius: 8px;
}
.theory-panel .challenge-box h3 { color: var(--success); margin-top: 0; }
.editor-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 400px;
}
.editor-toolbar {
  background: var(--bg-secondary);
  padding: 10px 16px;
  display: flex;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.btn {
  padding: 8px 16px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-run { background: var(--success); color: #000; }
.btn-run:hover { background: #2bc06a; }
.btn-submit { background: var(--accent); color: #000; }
.btn-submit:hover { background: var(--accent-hover); }
.btn-reset-code { background: var(--bg-tertiary); color: var(--text); border: 1px solid var(--border); }
.btn-reset-code:hover { border-color: var(--text); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.editor-container { flex: 1; position: relative; overflow: hidden; }
.CodeMirror {
  height: 100% !important;
  font-size: 14px;
  font-family: 'Courier New', monospace;
}
.output-panel {
  background: #000;
  border-top: 2px solid var(--border);
  padding: 12px 16px;
  max-height: 200px;
  overflow-y: auto;
  font-family: 'Courier New', monospace;
  font-size: 13px;
}
.output-panel .output-line {
  margin-bottom: 4px;
  white-space: pre-wrap;
  word-break: break-word;
}
.output-panel .output-line.error { color: var(--error); }
.output-panel .output-line.success { color: var(--success); }
.output-panel .output-line.info { color: var(--link); }
.tests-panel {
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  max-height: 180px;
  overflow-y: auto;
}
.tests-panel h4 {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.test-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  font-size: 13px;
  font-family: 'Courier New', monospace;
}
.test-item.pass { color: var(--success); }
.test-item.fail { color: var(--error); }
.test-item.pending { color: var(--text-muted); }
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 35, 0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.spinner {
  width: 50px;
  height: 50px;
  border: 4px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--text-muted); font-size: 14px; }
.toast {
  position: fixed;
  top: 80px;
  right: 20px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-left: 4px solid var(--success);
  padding: 12px 20px;
  border-radius: 6px;
  z-index: 200;
  animation: slideIn 0.3s;
  max-width: 300px;
}
.toast.error { border-left-color: var(--error); }
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@media (max-width: 900px) {
  .menu-toggle { display: block; }
  .sidebar {
    position: fixed;
    left: -320px;
    top: 65px;
    height: calc(100vh - 65px);
    z-index: 50;
    transition: left 0.3s;
  }
  .sidebar.open { left: 0; }
  .main-content { flex-direction: column; }
  .theory-panel {
    max-width: 100%;
    min-width: 100%;
    max-height: 40vh;
    padding: 20px;
  }
  .editor-panel { min-width: 100%; }
  .landing h1 { font-size: 32px; }
}
.hidden { display: none !important; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #555; }
</style>
</head>
<body>

<header class="header">
  <div class="logo" onclick="showLanding()">
    <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f1be32"/>
          <stop offset="100%" stop-color="#facc15"/>
        </linearGradient>
      </defs>
      <rect width="40" height="40" rx="8" fill="#1b1b32"/>
      <path d="M12 8 L12 20 Q12 26 18 26 L22 26 Q28 26 28 20 L28 14" stroke="url(#g1)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="16" cy="13" r="1.5" fill="#f1be32"/>
      <path d="M28 32 L28 20 Q28 14 22 14 L18 14 Q12 14 12 20 L12 26" stroke="#99c9ff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
      <circle cx="24" cy="27" r="1.5" fill="#99c9ff"/>
    </svg>
    <div class="logo-text">Python<span>Camp</span></div>
  </div>
  <div class="header-actions">
    <div class="progress-badge">Прогресс: <strong id="globalProgress">0%</strong></div>
    <button class="btn-reset" onclick="resetProgress()">Сбросить прогресс</button>
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  </div>
</header>

<div id="landing" class="landing">
  <div class="landing-hero">
    <h1>Изучайте Python с нуля</h1>
    <p class="lead">Бесплатный интерактивный курс по Python с практическими заданиями. Пишите код прямо в браузере и получайте мгновенную обратную связь.</p>
    <button class="btn-primary" onclick="startCourse()">Начать обучение</button>
  </div>
  <div class="stats">
    <div class="stat-card">
      <div class="num" id="statSections">13</div>
      <div class="label">Разделов курса</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statLessons">50+</div>
      <div class="label">Уроков</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statTests">100+</div>
      <div class="label">Практических заданий</div>
    </div>
    <div class="stat-card">
      <div class="num">∞</div>
      <div class="label">Возможностей</div>
    </div>
  </div>
  <div class="sections-grid" id="sectionsGrid"></div>
</div>

<div id="courseView" class="course-view">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <div class="theory-panel" id="theoryPanel"></div>
    <div class="editor-panel">
      <div class="editor-toolbar">
        <button class="btn btn-run" id="btnRun" onclick="runCode()">▶ Запустить</button>
        <button class="btn btn-submit" id="btnSubmit" onclick="submitCode()">✓ Проверить</button>
        <button class="btn btn-reset-code" onclick="resetCode()">↺ Сбросить</button>
        <button class="btn btn-reset-code" onclick="prevLesson()">← Назад</button>
        <button class="btn btn-reset-code" onclick="nextLesson()">Далее →</button>
      </div>
      <div class="editor-container">
        <textarea id="codeEditor"></textarea>
      </div>
      <div class="tests-panel" id="testsPanel">
        <h4>Тесты</h4>
        <div id="testsList"></div>
      </div>
      <div class="output-panel" id="outputPanel"></div>
    </div>
  </div>
</div>

<div id="loadingOverlay" class="loading-overlay hidden">
  <div class="spinner"></div>
  <div class="loading-text">Загрузка интерпретатора Python...</div>
</div>

<script>
// ============ COURSE DATA ============
const courseData = [
  {
    title: "Основы Python",
    lessons: [
      {
        id: "basics-1",
        title: "Привет, Python!",
        theory: `
          <h1>Привет, Python!</h1>
          <div class="lesson-meta">Раздел 1 · Урок 1 · ~5 мин</div>
          <p>Добро пожаловать на курс Python! Python — один из самых популярных языков программирования в мире. Он используется в веб-разработке, анализе данных, машинном обучении, автоматизации и многом другом.</p>
          <h2>Почему Python?</h2>
          <ul>
            <li><strong>Простой синтаксис</strong> — код читается почти как английский текст</li>
            <li><strong>Огромное сообщество</strong> — миллионы разработчиков по всему миру</li>
            <li><strong>Богатая экосистема</strong> — тысячи библиотек для любых задач</li>
            <li><strong>Универсальность</strong> — от скриптов до искусственного интеллекта</li>
          </ul>
          <h2>Ваша первая программа</h2>
          <p>Традиционно изучение любого языка начинают с программы <code>Hello, World!</code>. В Python это делается одной строкой:</p>
          <pre><code>print("Hello, World!")</code></pre>
          <p>Функция <code>print()</code> выводит текст на экран. Текст заключается в кавычки — это называется <em>строкой</em> (string).</p>
          <div class="info-box">💡 <strong>Совет:</strong> Используйте как двойные <code>"..."</code>, так и одинарные <code>'...'</code> кавычки — они равнозначны.</div>
          <div class="challenge-box">
            <h3>🎯 Задание</h3>
            <p>Выведите на экран фразу <code>Hello, Python!</code></p>
          </div>
        `,
        starterCode: `# Выведите "Hello, Python!"\n`,
        tests: [
          { desc: "Вывод содержит 'Hello, Python!'", check: (out) => out.includes("Hello, Python!") }
        ]
      },
      {
        id: "basics-2",
        title: "Комментарии",
        theory: `
          <h1>Комментарии</h1>
          <div class="lesson-meta">Раздел 1 · Урок 2 · ~3 мин</div>
          <p>Комментарии — это пояснения в коде, которые игнорируются интерпретатором. Они помогают понять логику программы.</p>
          <h2>Однострочные комментарии</h2>
          <p>Начинаются с символа <code>#</code>:</p>
          <pre><code># Это комментарий
print("Привет")  # Комментарий после кода</code></pre>
          <h2>Многострочные комментарии</h2>
          <p>Используйте тройные кавычки:</p>
          <pre><code>"""
Это многострочный
комментарий
"""
print("Код работает")</code></pre>
          <div class="info-box">💡 <strong>Совет:</strong> Пишите комментарии, объясняющие <em>почему</em> вы делаете что-то, а не <em>что</em> делает код.</div>
          <div class="challenge-box">
            <h3>🎯 Задание</h3>
            <p>Добавьте комментарий <code># Мой первый комментарий</code> и выведите фразу <code>Учусь Python</code></p>
          </div>
        `,
        starterCode: `# Добавьте комментарий и выведите текст\n`,
        tests: [
          { desc: "Вывод содержит 'Учусь Python'", check: (out) => out.includes("Учусь Python") },
          { desc: "Код содержит комментарий", check: (out, code) => code.includes("#") }
        ]
      },
      {
        id: "basics-3",
        title: "Переменные",
        theory: `
          <h1>Переменные</h1>
          <div class="lesson-meta">Раздел 1 · Урок 3 · ~7 мин</div>
          <p>Переменная — это именованная ячейка памяти для хранения данных. В Python не нужно объявлять тип переменной — он определяется автоматически.</p>
          <h2>Создание переменных</h2>
          <pre><code>name = "Алиса"
age = 25
height = 1.68
is_student = True

print(name)
print(age)</code></pre>
          <h2>Правила именования</h2>
          <ul>
            <li>Имя может содержать буквы, цифры и символ <code>_</code></li>

          <div class="challenge-box">

            <p>Используя <code>itertools.combinations</code>, найдите все пары из списка <code>['A', 'B', 'C', 'D']</code> и выведите их количество (должно быть <code>6</code>).</p>

        starterCode: `from itertools import combinations\n\nletters = ['A', 'B', 'C', 'D']\n# Найдите все пары и их количество\n`,

  },
  {

    lessons: [
      {

// ============ STATE ============
let currentSection = 0;
let currentLesson = 0;
let completedLessons = new Set();
let editor = null;
let pyodide = null;
let pyodideLoading = false;

// ============ INIT ============
function loadProgress() {
  try {
    const saved = localStorage.getItem('pythoncamp_progress');
    if (saved) completedLessons = new Set(JSON.parse(saved));
  } catch(e) {}
}

function saveProgress() {
  try {
    localStorage.setItem('pythoncamp_progress', JSON.stringify([...completedLessons]));
  } catch(e) {}
}

function resetProgress() {
  if (confirm('Сбросить весь прогресс?')) {
    completedLessons.clear();
    saveProgress();
    updateGlobalProgress();
    renderSidebar();
    renderSectionsGrid();
    showToast('Прогресс сброшен');
  }
}

function updateGlobalProgress() {
  const total = courseData.reduce((s, sec) => s + sec.lessons.length, 0);
  const percent = Math.round((completedLessons.size / total) * 100);
  document.getElementById('globalProgress').textContent = percent + '%';
  
  const totalLessons = courseData.reduce((s, sec) => s + sec.lessons.length, 0);
  const totalTests = courseData.reduce((s, sec) => s + sec.lessons.reduce((ls, l) => ls + l.tests.length, 0), 0);
  document.getElementById('statSections').textContent = courseData.length;
  document.getElementById('statLessons').textContent = totalLessons + '+';
  document.getElementById('statTests').textContent = totalTests + '+';
}

// ============ LANDING ============
function renderSectionsGrid() {
  const grid = document.getElementById('sectionsGrid');
  grid.innerHTML = courseData.map((section, si) => {
    const completed = section.lessons.filter(l => completedLessons.has(l.id)).length;
    const total = section.lessons.length;
    const percent = Math.round((completed / total) * 100);
    return `
      <div class="section-card" onclick="openSection(${si})">
        <div class="section-num">Раздел ${si + 1}</div>
        <h3>${section.title}</h3>
        <div class="desc">${total} уроков · ${section.lessons.map(l => l.title).slice(0, 2).join(', ')}${total > 2 ? '...' : ''}</div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${percent}%"></div></div>
        <div class="progress-text">${completed} из ${total} уроков (${percent}%)</div>
      </div>
    `;
  }).join('');
}

function showLanding() {
  document.getElementById('landing').classList.remove('hidden');
  document.getElementById('courseView').classList.remove('active');
  renderSectionsGrid();
}

function startCourse() {
  let found = false;
  for (let si = 0; si < courseData.length && !found; si++) {
    for (let li = 0; li < courseData[si].lessons.length && !found; li++) {
      if (!completedLessons.has(courseData[si].lessons[li].id)) {
        currentSection = si;
        currentLesson = li;
        found = true;
      }
    }
  }
  if (!found) {
    currentSection = 0;
    currentLesson = 0;
  }
  openCourse();
}

function openSection(sectionIndex) {
  currentSection = sectionIndex;
  currentLesson = 0;
  openCourse();
}

function openCourse() {
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('courseView').classList.add('active');
  renderSidebar();
  loadLesson();
  ensurePyodide();
}

// ============ SIDEBAR ============
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = courseData.map((section, si) => {
    const lessons = section.lessons.map((lesson, li) => {
      const isActive = si === currentSection && li === currentLesson;
      const isCompleted = completedLessons.has(lesson.id);
      return `
        <div class="lesson-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}" 
             onclick="goToLesson(${si}, ${li})">
          ${lesson.title}
        </div>
      `;
    }).join('');
    return `
      <div class="sidebar-section">
        <div class="sidebar-section-header" onclick="toggleSection(this)">
          <span>Раздел ${si + 1}: ${section.title}</span>
          <span class="arrow">▼</span>
        </div>
        <div class="lesson-list">${lessons}</div>
      </div>
    `;
  }).join('');
}

function toggleSection(header) {
  header.parentElement.classList.toggle('collapsed');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ============ LESSON ============
function goToLesson(si, li) {
  currentSection = si;
  currentLesson = li;
  renderSidebar();
  loadLesson();
  document.getElementById('sidebar').classList.remove('open');
}

function loadLesson() {
  const lesson = courseData[currentSection].lessons[currentLesson];
  
  document.getElementById('theoryPanel').innerHTML = lesson.theory;
  
  if (editor) {
    editor.toTextArea();
  }
  document.getElementById('codeEditor').value = lesson.starterCode;
  editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
    mode: 'python',
    theme: 'dracula',
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    indentWithTabs: false,
    lineWrapping: true,
    autofocus: false
  });
  
  renderTests(lesson.tests);
  document.getElementById('outputPanel').innerHTML = '';
  document.getElementById('theoryPanel').scrollTop = 0;
}

function renderTests(tests) {
  const list = document.getElementById('testsList');
  list.innerHTML = tests.map((t, i) => 
    `<div class="test-item pending" data-idx="${i}">○ ${t.desc}</div>`
  ).join('');
}

function resetCode() {
  const lesson = courseData[currentSection].lessons[currentLesson];
  editor.setValue(lesson.starterCode);
  document.getElementById('outputPanel').innerHTML = '';
  renderTests(lesson.tests);
}

function prevLesson() {
  if (currentLesson > 0) {
    currentLesson--;
  } else if (currentSection > 0) {
    currentSection--;
    currentLesson = courseData[currentSection].lessons.length - 1;
  } else {
    showToast('Это первый урок');
    return;
  }
  renderSidebar();
  loadLesson();
}

function nextLesson() {
  if (currentLesson < courseData[currentSection].lessons.length - 1) {
    currentLesson++;
  } else if (currentSection < courseData.length - 1) {
    currentSection++;
    currentLesson = 0;
  } else {
    showToast('🎉 Вы прошли весь курс!');
    showLanding();
    return;
  }
  renderSidebar();
  loadLesson();
}

// ============ PYODIDE ============
async function ensurePyodide() {
  if (pyodide || pyodideLoading) return;
  pyodideLoading = true;
  document.getElementById('loadingOverlay').classList.remove('hidden');
  
  try {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js';
    document.head.appendChild(script);
    
    await new Promise((resolve, reject) => {
      script.onload = resolve;
      script.onerror = reject;
    });
    
    pyodide = await loadPyodide({
      indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/'
    });
    
    pyodide.setStdout({ batched: (text) => {
      appendOutput(text, '');
    }});
    pyodide.setStderr({ batched: (text) => {
      appendOutput(text, 'error');
    }});
    
    showToast('Python готов к работе!');
  } catch(e) {
    console.error(e);
    showToast('Ошибка загрузки Python: ' + e.message, true);
  } finally {
    pyodideLoading = false;
    document.getElementById('loadingOverlay').classList.add('hidden');
  }
}

function appendOutput(text, cls) {
  const panel = document.getElementById('outputPanel');
  const line = document.createElement('div');
  line.className = 'output-line ' + (cls || '');
  line.textContent = text;
  panel.appendChild(line);
  panel.scrollTop = panel.scrollHeight;
}

// ============ RUN CODE ============
async function runCode() {
  if (!pyodide) {
    await ensurePyodide();
    if (!pyodide) return;
  }
  
  const code = editor.getValue();
  document.getElementById('outputPanel').innerHTML = '';
  document.getElementById('btnRun').disabled = true;
  
  try {
    await pyodide.runPythonAsync(code);
  } catch(e) {
    appendOutput(String(e), 'error');
  } finally {
    document.getElementById('btnRun').disabled = false;
  }
}

// ============ SUBMIT ============
async function submitCode() {
  if (!pyodide) {
    await ensurePyodide();
    if (!pyodide) return;
  }
  
  const lesson = courseData[currentSection].lessons[currentLesson];
  const code = editor.getValue();
  
  let output = '';
  pyodide.setStdout({ batched: (text) => { output += text + '\n'; }});
  pyodide.setStderr({ batched: (text) => { output += text + '\n'; }});
  
  document.getElementById('outputPanel').innerHTML = '';
  document.getElementById('btnSubmit').disabled = true;
  
  try {
    await pyodide.runPythonAsync(code);
  } catch(e) {
    output += String(e) + '\n';
  }
  
  pyodide.setStdout({ batched: (text) => { appendOutput(text, ''); }});
  pyodide.setStderr({ batched: (text) => { appendOutput(text, 'error'); }});
  
  const testItems = document.querySelectorAll('.test-item');
  let allPassed = true;
  lesson.tests.forEach((test, i) => {
    let passed = false;
    try {
      passed = test.check(output, code);
    } catch(e) {
      try {
        passed = test.check(output);
      } catch(e2) {
        try {
          passed = test.check(code);
        } catch(e3) {
          passed = false;
        }
      }
    }
    
    const item = testItems[i];
    if (passed) {
      item.className = 'test-item pass';
      item.innerHTML = '✓ ' + test.desc;
    } else {
      item.className = 'test-item fail';
      item.innerHTML = '✗ ' + test.desc;
      allPassed = false;
    }
  });
  
  output.split('\n').filter(l => l.length > 0).forEach(line => {
    appendOutput(line, '');
  });
  
  if (allPassed) {
    completedLessons.add(lesson.id);
    saveProgress();
    updateGlobalProgress();
    renderSidebar();
    showToast('🎉 Отлично! Урок пройден!');
    
    setTimeout(() => {
      if (currentLesson < courseData[currentSection].lessons.length - 1 || currentSection < courseData.length - 1) {
        nextLesson();
      }
    }, 1500);
  } else {
    showToast('Есть непройденные тесты. Попробуйте ещё!', true);
  }
  
  document.getElementById('btnSubmit').disabled = false;
}

// ============ TOAST ============
function showToast(message, isError) {
  const toast = document.createElement('div');
  toast.className = 'toast' + (isError ? ' error' : '');
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

// ============ START ============
loadProgress();
updateGlobalProgress();
renderSectionsGrid();
</script>
